# The CI of a Go library: the jobs of the Go CLIs' CI (suppyhq-cli,
# lognorth-cli), on the newest patch of the Go minor in go.mod. Its name must
# stay "CI": merge-security-updates.yml waits for a workflow of that name.
# go.mod says go 1.26.0. setup-go treats that as the exact release, so each
# job asks for the 1.26 minor and check-latest takes the newest 1.26.x.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...

  # Minor, not go.mod's patch: an exact patch pins setup-go, and go.mod names only
  # the oldest Go this library supports.
  security:
    uses: karloscodes/workflows/.github/workflows/go-security.yml@v1.1.0
    with:
      go-version: "1.26"

  gitleaks:
    uses: karloscodes/workflows/.github/workflows/gitleaks.yml@v1.1.0

  # The one check to require on main: it passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [go-test, security, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
